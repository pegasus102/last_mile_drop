<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last-Mile Whisper HUD</title>
<style>

  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #2d3f57;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --accent-purple: #7c3aed;
    --accent-purple-dim: #2e1f4d;
    --accent-green: #22c55e;
    --accent-yellow: #eab308;
    --accent-red: #ef4444;
    --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */

  header.hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 4px;
  }

  .hud-title {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .shield-badge {
    background: var(--accent-purple-dim);
    color: #c4b5fd;
    border: 1px solid var(--accent-purple);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .shield-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
  }

  /* Card */

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px;
  }

  .card h2 {
    font-family: var(--font-display);
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 12px;
    color: var(--text);
  }

  .card-subtext {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: -6px 0 14px;
  }

  /* Proximity Input */

  .proximity-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .proximity-row label {
    font-size: 0.85rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  #distance-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: var(--font-body);
    width: 100%;
  }

  #distance-input:focus {
    outline: none;
    border-color: var(--accent-purple);
  }

  .unit-suffix {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* Shield status line */

  .shield-status {
    margin-top: 12px;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .shield-status.locked {
    background: rgba(239, 68, 68, 0.12);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .shield-status.landmarks-only {
    background: rgba(234, 179, 8, 0.1);
    color: #fde68a;
    border: 1px solid rgba(234, 179, 8, 0.3);
  }

  .shield-status.doorbell-unlocked {
    background: rgba(34, 197, 94, 0.1);
    color: #86efac;
    border: 1px solid rgba(34, 197, 94, 0.3);
  }

  /* Landmark Tags */

  #landmark-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag-placeholder,
  .landmark-tag {
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.8rem;
  }

  .tag-placeholder {
    border: 1px dashed var(--card-border);
    color: var(--text-muted);
  }

  .landmark-tag {
    border: 1px solid var(--accent-purple);
    background: var(--accent-purple-dim);
    color: #ddd6fe;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }

  /* Doorbell Buttons */

  .doorbell-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  button.hud-btn {
    font-family: var(--font-body);
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 10px;
    padding: 14px 16px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }

  button.hud-btn:hover:not(:disabled) {
    filter: brightness(1.08);
  }

  button.hud-btn:active:not(:disabled) {
    filter: brightness(0.95);
  }

  button.hud-btn:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  .btn-doorbell.state-locked {
    background: #334155;
    color: var(--text-muted);
  }

  .btn-doorbell.state-yellow {
    background: var(--accent-yellow);
    color: #1c1502;
  }

  .btn-doorbell.state-green {
    background: var(--accent-green);
    color: #052e14;
  }

  .btn-call {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--card-border);
    display: none;
  }

  .btn-call.visible {
    display: flex;
  }

  /* Status Log */

  .status-log {
    background: #0b1424;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.75rem;
    color: #94a3b8;
    max-height: 160px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .status-log .log-line span.tag {
    color: #64748b;
  }

</style>
</head>
<body>

  <div class="shell">

    <header class="hud-header">
      <h1 class="hud-title">📦 Last-Mile Whisper HUD</h1>
      <span class="shield-badge">Cedar Shield Active</span>
    </header>

    <section class="card">
      <h2>Driver Proximity</h2>
      <div class="proximity-row">
        <label for="distance-input">Distance</label>
        <input type="number" id="distance-input" value="400" min="0" step="10">
        <span class="unit-suffix">meters</span>
      </div>
      <div class="shield-status" id="shield-status"></div>
    </section>

    <section class="card" id="landmark-section">
      <h2>Landmark Tags</h2>
      <p class="card-subtext">Unlocked within 500m of the delivery pin.</p>
      <div id="landmark-tags">
        <span class="tag-placeholder">Landmark —</span>
        <span class="tag-placeholder">Turn —</span>
        <span class="tag-placeholder">Door Color —</span>
      </div>
    </section>

    <section class="card" id="doorbell-section">
      <h2>Digital Doorbell</h2>
      <p class="card-subtext">Unlocks within 20m of the delivery pin.</p>
      <div class="doorbell-actions">
        <button class="hud-btn btn-doorbell state-locked" id="ping-btn" disabled>
          🔒 Locked (Outside 20m)
        </button>
        <button class="hud-btn btn-call" id="call-btn">
          📞 Call Customer Directly
        </button>
      </div>
    </section>

    <section class="card" id="log-section">
      <h2>Status Log</h2>
      <div class="status-log" id="status-log">
        <div class="log-line"><span class="tag">[init]</span> HUD ready. Awaiting proximity data.</div>
      </div>
    </section>

  </div>

<script>

  const distanceInput = document.getElementById('distance-input');
  const shieldStatus = document.getElementById('shield-status');
  const landmarkTags = document.getElementById('landmark-tags');
  const pingBtn = document.getElementById('ping-btn');
  const callBtn = document.getElementById('call-btn');
  const statusLog = document.getElementById('status-log');

  const CHIME_DURATION_SECONDS = 30;
  const MAX_PINGS = 2;

  let pingCount = 0;
  let countdownTimer = null;

  const SAMPLE_LANDMARKS = [
    { icon: '🌳', label: 'Peepal Tree' },
    { icon: '↩️', label: 'Left after tree' },
    { icon: '🚪', label: 'Red Door' },
  ];

  function logLine(tag, message) {
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="tag">[${tag}]</span> ${message}`;
    statusLog.appendChild(line);
    statusLog.scrollTop = statusLog.scrollHeight;
  }

  function renderLandmarkTags(unlocked) {
    landmarkTags.innerHTML = '';

    if (!unlocked) {
      const placeholders = ['Landmark —', 'Turn —', 'Door Color —'];
      placeholders.forEach((text) => {
        const span = document.createElement('span');
        span.className = 'tag-placeholder';
        span.textContent = text;
        landmarkTags.appendChild(span);
      });
      return;
    }

    SAMPLE_LANDMARKS.forEach((tag) => {
      const span = document.createElement('span');
      span.className = 'landmark-tag';
      span.innerHTML = `${tag.icon} ${tag.label}`;
      landmarkTags.appendChild(span);
    });
  }

  function setDoorbellState(state) {
    // state: 'locked' | 'yellow' | 'green'
    pingBtn.classList.remove('state-locked', 'state-yellow', 'state-green');

    if (state === 'locked') {
      pingBtn.classList.add('state-locked');
      pingBtn.disabled = true;
      pingBtn.innerHTML = '🔒 Locked (Outside 20m)';
    } else if (state === 'yellow') {
      pingBtn.classList.add('state-yellow');
      pingBtn.disabled = true;
      pingBtn.innerHTML = '🟡 Doorbell Ready (Get Closer)';
    } else if (state === 'green') {
      pingBtn.classList.add('state-green');
      pingBtn.disabled = false;
      pingBtn.innerHTML = '🔔 Ping Digital Doorbell';
    }
  }

  function resetDoorbellFlow() {
    if (countdownTimer) {
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
    pingCount = 0;
    callBtn.classList.remove('visible');
  }

  function updateHUD() {
    const distance = parseFloat(distanceInput.value);

    if (isNaN(distance) || distance < 0) {
      logLine('error', 'Invalid distance value.');
      return;
    }

    shieldStatus.classList.remove('locked', 'landmarks-only', 'doorbell-unlocked');

    if (distance > 500) {
      shieldStatus.classList.add('locked');
      shieldStatus.textContent = '🔒 Cedar Shield: Privacy Locked (>500m)';
      renderLandmarkTags(false);
      setDoorbellState('locked');
      resetDoorbellFlow();
      logLine('cedar', `DENIED — distance ${distance}m exceeds 500m radius.`);

    } else if (distance > 20 && distance <= 500) {
      shieldStatus.classList.add('landmarks-only');
      shieldStatus.textContent = '🟡 Landmarks Unlocked — Doorbell Locked (>20m)';
      renderLandmarkTags(true);
      setDoorbellState('yellow');
      resetDoorbellFlow();
      logLine('cedar', `ALLOWED (ReadLandmark) — distance ${distance}m within 500m radius.`);
      logLine('cedar', `DENIED (PingDoorbell) — distance ${distance}m exceeds 20m radius.`);

    } else {
      shieldStatus.classList.add('doorbell-unlocked');
      shieldStatus.textContent = '🟢 Digital Doorbell Unlocked (≤20m)';
      renderLandmarkTags(true);
      setDoorbellState('green');
      logLine('cedar', `ALLOWED by Cedar Policy — distance ${distance}m within 20m radius.`);
    }
  }

  function pingDoorbell() {
    if (pingBtn.disabled) return;

    pingCount += 1;
    pingBtn.disabled = true;

    logLine('doorbell', `Sending 30s chime alert to customer's phone (attempt ${pingCount}/${MAX_PINGS})...`);
    pingBtn.innerHTML = `🔔 Ringing... (${CHIME_DURATION_SECONDS}s)`;

    let secondsLeft = CHIME_DURATION_SECONDS;

    countdownTimer = setInterval(() => {
      secondsLeft -= 1;

      if (secondsLeft > 0) {
        pingBtn.innerHTML = `🔔 Ringing... (${secondsLeft}s)`;
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        handlePingTimeout();
      }
    }, 1000);
  }

  function handlePingTimeout() {
    logLine('doorbell', 'Chime timed out — no acknowledgment received.');

    if (pingCount >= MAX_PINGS) {
      pingBtn.classList.remove('state-green', 'state-yellow');
      pingBtn.classList.add('state-locked');
      pingBtn.disabled = true;
      pingBtn.innerHTML = '🚫 Max Pings Exceeded';
      callBtn.classList.add('visible');
      logLine('doorbell', 'MAX_PINGS_EXCEEDED — direct call required.');
    } else {
      pingBtn.disabled = false;
      pingBtn.innerHTML = '🔄 Ping Once More (2nd Try)';
      callBtn.classList.add('visible');
      logLine('doorbell', 'Doorbell available for a second attempt.');
    }
  }

  function callCustomer() {
    logLine('call', 'Placing masked direct call to customer...');
  }

  distanceInput.addEventListener('input', updateHUD);
  pingBtn.addEventListener('click', pingDoorbell);
  callBtn.addEventListener('click', callCustomer);

  updateHUD();

</script>

</body>
</html>
